[project]
name = "text-to-persons"
version = "1.0.0"
description = "Text to person entities via an LLM extraction microservice with a benchmark frontend (DTU NLP & LLM assignment)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.5",
    # Explicit: Settings(env_file=".env") reads .env files through python-dotenv.
    "python-dotenv>=0.21.0",
    # Jinja2Templates renders the frontend index page.
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
